# Cloudflare Pages配置 - Remix项目
# 这个配置专门为Cloudflare Pages SSR部署优化

[build]
command = "pnpm run build"

# Node.js 兼容性配置
compatibility_date  = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静态文件缓存优化
[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31536000, immutable"
