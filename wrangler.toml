# Cloudflare Pages配置 - Remix/React Router项目
# 这个配置专门为Cloudflare Pages部署优化

[build]
command = "pnpm run build"

[build.upload]
format = "static"
dir = "./build/client"

# SPA路由支持 - 所有请求都重定向到index.html
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
compatibility_date  = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静态文件缓存优化
[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31536000, immutable"
